<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Formatter Pro</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            900: '#1a0b2e', // Deep dark purple background
                            800: '#2d1b4e',
                            700: '#432c7a',
                            600: '#6b46c1',
                            500: '#805ad5',
                        }
                    },
                    animation: {
                        blob: "blob 10s infinite",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            background-color: #0f0518;
            background-image: radial-gradient(circle at 50% 0%, #2d1b4e 0%, #0f0518 70%);
        }
        /* Custom scrollbar for glassmorphism aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.6);
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>

<body class="min-h-screen text-slate-200 relative overflow-x-hidden font-sans flex flex-col">
    
    <!-- Decorative Glowing Orbs -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-purple-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob z-0 pointer-events-none"></div>
    <div class="fixed top-[20%] right-[-5%] w-80 h-80 bg-fuchsia-600/10 rounded-full mix-blend-screen filter blur-[80px] animate-blob animation-delay-2000 z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] left-[20%] w-96 h-96 bg-indigo-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-4000 z-0 pointer-events-none"></div>

    <main class="relative z-10 container mx-auto px-4 py-8 w-full max-w-6xl h-screen flex flex-col">
        
        <!-- App Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">
                    Order Formatter
                </h1>
                <p class="text-sm sm:text-base text-slate-400 mt-1">Rapikan teks auto-order menjadi rapi & siap kirim.</p>
            </div>
            
            <div class="p-3 rounded-full bg-white/5 backdrop-blur-md border border-white/10 shadow-sm">
                <i class="ph ph-sun text-xl text-amber-400"></i>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-4 bg-brand-900/40 backdrop-blur-xl border border-white/10 rounded-3xl p-4 sm:p-5 shadow-2xl">
            
            <!-- Left Side: Raw Input -->
            <div class="flex flex-col h-[40vh] lg:h-full space-y-3">
                <div class="flex justify-between items-center px-1">
                    <label for="rawInput" class="font-semibold text-sm flex items-center gap-2 text-slate-300">
                        <i class="ph ph-file-text text-lg"></i> Teks Mentah (Raw)
                    </label>
                    <button id="clearBtn" class="text-xs text-red-400 hover:text-red-300 font-medium flex items-center gap-1 transition-colors px-2 py-1 rounded-md hover:bg-red-900/30">
                        <i class="ph ph-trash"></i> Bersihkan
                    </button>
                </div>
                <textarea id="rawInput" class="w-full h-full flex-1 p-5 rounded-2xl bg-[#130922] border border-white/5 focus:ring-1 focus:ring-purple-500 focus:border-purple-500 focus:outline-none resize-none placeholder-slate-600 transition-all text-sm shadow-inner leading-relaxed text-slate-300" placeholder="Tempel teks auto-order di sini..."></textarea>
            </div>

            <!-- Right Side: Formatted Output -->
            <div class="flex flex-col h-[40vh] lg:h-full space-y-3">
                <div class="flex justify-between items-center px-1">
                    <label class="font-semibold text-sm flex items-center gap-2 text-slate-300">
                        <i class="ph ph-magic-wand text-lg"></i> Hasil Format
                    </label>
                    <button id="copyBtn" class="bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 text-white px-4 py-1.5 rounded-xl text-xs font-semibold shadow-lg shadow-purple-500/20 transition-all flex items-center gap-1.5 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="ph ph-copy text-sm"></i> <span id="copyText">Salin Teks</span>
                    </button>
                </div>
                <!-- Visual Display -->
                <div id="outputResult" class="w-full h-full flex-1 p-5 rounded-2xl bg-[#130922] border border-white/5 overflow-y-auto text-sm font-medium leading-relaxed shadow-inner text-slate-200">
                    <p class="text-slate-500 italic">Hasil format rapi akan otomatis muncul di sini...</p>
                </div>
                <!-- Hidden textarea for copying purposes -->
                <textarea id="hiddenOutput" class="hidden"></textarea>
            </div>
            
        </div>
        
        <footer class="mt-6 text-center text-xs text-slate-500">
            Internal Tools &copy; <span id="year"></span> | Advanced RegEx Formatter
        </footer>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const rawInput = document.getElementById('rawInput');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyText = document.getElementById('copyText');

        function formatText() {
            const rawText = document.getElementById('rawInput').value;
            const output = document.getElementById('outputResult');
            const hiddenOutput = document.getElementById('hiddenOutput');

            if (!rawText.trim()) {
                output.innerHTML = '<p class="text-slate-500 italic">Hasil format rapi akan otomatis muncul di sini...</p>';
                hiddenOutput.value = '';
                copyBtn.disabled = true;
                return;
            }

            const lines = rawText.split('\n').map(l => l.trim());
            let productName = "";
            let accountDetails = [];
            let terms = [];
            let lastAccountLineIdx = -1;

            // 1. Extract Product Name
            const serviceRegex = /(?:Service|Produk)\s*:\s*(.+)/i;
            for (let i = 0; i < lines.length; i++) {
                let match = lines[i].match(serviceRegex);
                if (match) {
                    productName = match[1].trim();
                    break;
                }
            }
            
            // Fallback if Service is not found (grab the first clean line)
            if (!productName) {
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i] && !lines[i].includes('GENJOS') && !lines[i].includes('TRANSAKSI')) {
                        productName = lines[i].replace(/^[—\-\|]\s*/, '').trim();
                        break;
                    }
                }
            }

            // 2. Extract Account Details & Track Last Position
            for (let i = 0; i < lines.length; i++) {
                const lower = lines[i].toLowerCase();
                if (lower.startsWith('email:') || lower.startsWith('- email:') || lower.match(/^\d+\.\s*email:/)) {
                    accountDetails.push(lines[i].replace(/^(\d+\.|-)\s*/, ''));
                    lastAccountLineIdx = Math.max(lastAccountLineIdx, i);
                } else if (lower.startsWith('password:') || lower.startsWith('- password:') || lower.match(/^\d+\.\s*password:/)) {
                    accountDetails.push(lines[i].replace(/^(\d+\.|-)\s*/, ''));
                    lastAccountLineIdx = Math.max(lastAccountLineIdx, i);
                } else if (lower.startsWith('akses email:') || lower.startsWith('- akses email:')) {
                     accountDetails.push(lines[i].replace(/^(\d+\.|-)\s*/, ''));
                     lastAccountLineIdx = Math.max(lastAccountLineIdx, i);
                }
            }

            // 3. Extract Syarat & Ketentuan (Everything below the last account detail)
            if (lastAccountLineIdx !== -1) {
                for (let i = lastAccountLineIdx + 1; i < lines.length; i++) {
                    let line = lines[i];
                    if (!line) continue;

                    const lowerLine = line.toLowerCase();
                    
                    // Skip bot header/footer strings completely
                    if (lowerLine.includes('genjos') || lowerLine.includes('[auto order]') || lowerLine.includes('[account detail]')) continue;
                    
                    // Skip exact specific complaint lines
                    if (lowerLine.startsWith('komplain soal produk')) continue;

                    // NEW: Instead of deleting the line, just replace the contact link inline!
                    line = line.replace(/wa\.me\/\d+/gi, 'Admin');
                    
                    // Clean specific prefixes like "1. ", "2. ", "- ", "— " but KEEP other numbers intact
                    let cleaned = line.replace(/^(\d+\.|-|—)\s*/, '').trim();

                    // Pastikan dengan sangat ketat bahwa variabel 'cleaned' tidak kosong
                    if (cleaned && cleaned.length > 0 && cleaned !== "") {
                        terms.push("- " + cleaned);
                    }
                }
            }

            let result = `*${productName || 'NAMA PRODUK'}*\n\n`;
            
            if (accountDetails.length > 0) {
                result += `*Detail Akun:*\n`;
                accountDetails.forEach(detail => {
                    result += `- ${detail}\n`;
                });
            }
            
            if (terms.length > 0) {
                result += `\n*Syarat & Ketentuan:*\n`;
                terms.forEach(term => {
                    result += `${term}\n`;
                });
            }

            // Hapus seluruh spasi atau baris baru (\n) yang tersisa di paling akhir hasil teks
            result = result.trim();

            // Update visual UI
            output.innerHTML = result.replace(/\n/g, '<br>');
            // Update hidden textarea for easy clipboard copy
            hiddenOutput.value = result;
            copyBtn.disabled = false;
        }

        // Event Listeners
        rawInput.addEventListener('input', formatText);

        clearBtn.addEventListener('click', () => {
            rawInput.value = '';
            formatText();
            rawInput.focus();
        });

        // Function to show toast notification
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = 'bg-brand-800 text-white px-4 py-2 rounded-xl shadow-lg border border-purple-500/30 text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2';
            toast.innerHTML = `<i class="ph ph-check-circle text-emerald-400 text-lg"></i> ${message}`;
            
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);
            
            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        copyBtn.addEventListener('click', () => {
            const textToCopy = document.getElementById('hiddenOutput').value;
            if (!textToCopy) return;

            // Robust fallback approach for mobile devices (especially iOS/Safari)
            // Membangun textarea sementara agar terbaca oleh mobile browser
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            
            // Menjadikan textarea tidak terlihat tetapi tetap dirender
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.width = "2em";
            textArea.style.height = "2em";
            textArea.style.padding = "0";
            textArea.style.border = "none";
            textArea.style.outline = "none";
            textArea.style.boxShadow = "none";
            textArea.style.background = "transparent";
            
            document.body.appendChild(textArea);
            
            // Focus & Select (sangat krusial untuk perangkat iOS)
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, 99999);

            try {
                // Eksekusi copy
                const successful = document.execCommand('copy');
                if (successful) {
                    // Visual feedback pada Button
                    const originalText = copyText.innerHTML;
                    const icon = copyBtn.querySelector('i');
                    
                    copyText.innerHTML = 'Disalin!';
                    icon.classList.replace('ph-copy', 'ph-check');
                    copyBtn.classList.replace('from-fuchsia-600', 'from-emerald-500');
                    copyBtn.classList.replace('to-purple-600', 'to-emerald-500');
                    copyBtn.classList.add('scale-105');

                    // Munculkan toast
                    showToast('Teks berhasil disalin!');

                    setTimeout(() => {
                        copyText.innerHTML = originalText;
                        icon.classList.replace('ph-check', 'ph-copy');
                        copyBtn.classList.replace('from-emerald-500', 'from-fuchsia-600');
                        copyBtn.classList.replace('to-emerald-500', 'to-purple-600');
                        copyBtn.classList.remove('scale-105');
                    }, 2000);
                } else {
                    showToast('Gagal menyalin teks. Silakan salin manual.');
                }
            } catch (err) {
                console.error('Failed to copy: ', err);
                showToast('Browser Anda tidak mendukung salin otomatis.');
            } finally {
                // Selalu hapus textarea buatan agar tidak meninggalkan sampah di memori
                document.body.removeChild(textArea);
            }
            
            // Hapus blok warna seleksi biru di HP
            window.getSelection().removeAllRanges();
        });

        // Initial setup
        copyBtn.disabled = true;
    </script>
</body>
</html>
